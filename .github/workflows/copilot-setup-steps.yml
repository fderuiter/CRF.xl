name: "Copilot Setup Steps"

# Allows the environment to re-evaluate when this workflow file changes
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # CRITICAL: This exact job key name is required by GitHub Copilot
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20" # Meets the project's node v16+ requirement
          cache: "npm"       # Leverages native npm caching for speed

      - name: Install Project Dependencies
        # Using 'npm ci' ensures a clean, deterministic install from package-lock.json
        run: npm ci
