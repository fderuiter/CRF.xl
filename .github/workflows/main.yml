name: CRF.xl CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: ⚙️ Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: 🧰 Install System Dependencies
      run: sudo apt-get update && sudo apt-get install -y libxml2-utils libsecret-1-dev

    - name: 📦 Install Dependencies
      run: npm ci

    - name: 💀 Dead Code Check
      run: npm run dead-code

    - name: 🔍 Check Production Dependencies
      run: npm run check-prod-deps

    - name: 🔐 Audit Production Dependencies
      run: npm audit --omit=dev --audit-level=high

    - name: 🧾 Validate Office add-in manifests
      run: npm run validate

    - name: 🎨 Enforce Code Formatting
      run: npm run lint

    - name: 📚 Validate Documentation Links
      run: node ./scripts/validate-docs.js --check-external

    - name: 🔍 Semantic Interface Validation
      run: npm run docs:api-check

    - name: 📚 Validate Documentation Code Blocks
      run: npm run docs:validate-code

    - name: 🔗 Validate Codebase Traceability
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        npm run docs:traceability
        if ! git diff --quiet docs/github/codebase-alignment.md; then
          echo "Drift detected in docs/github/codebase-alignment.md."
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::error::Traceability matrix drift detected! Please run 'npm run docs:traceability' locally and commit the updated docs/github/codebase-alignment.md file."
            exit 1
          fi
          
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "develop" ]; then
            echo "Cannot automatically commit to protected branch $BRANCH. Failing loudly."
            exit 1
          fi
          
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          git add docs/github/codebase-alignment.md
          git commit -m "chore: auto-regenerate traceability report [skip ci]"
          git push origin HEAD:"refs/heads/$BRANCH"
        fi

    - name: 📊 Validate Volatility Matrix and CI Gate
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        npm run docs:volatility
        if ! git diff --quiet docs/github/volatility-matrix.md; then
          echo "Drift detected in docs/github/volatility-matrix.md."
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::error::Volatility matrix drift detected! Please run 'npm run docs:volatility' locally and commit the updated docs/github/volatility-matrix.md file."
            exit 1
          fi
          
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "develop" ]; then
            echo "Cannot automatically commit to protected branch $BRANCH. Failing loudly."
            exit 1
          fi
          
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          git add docs/github/volatility-matrix.md
          git commit -m "chore: auto-regenerate volatility matrix [skip ci]"
          git push origin HEAD:"refs/heads/$BRANCH"
        fi

    - name: 🔎 Type Checking
      run: npx tsc --noEmit

    - name: 🏗️ Build Application
      run: npm run build --if-present
      env:
        DEV_CLIENT_ID: ${{ vars.DEV_CLIENT_ID }}
        STAGING_HOST_URL: ${{ vars.STAGING_HOST_URL }}
        STAGING_CLIENT_ID: ${{ secrets.STAGING_CLIENT_ID }}
        UAT_HOST_URL: ${{ vars.UAT_HOST_URL }}
        UAT_CLIENT_ID: ${{ secrets.UAT_CLIENT_ID }}
        PRODUCTION_HOST_URL: ${{ vars.PRODUCTION_HOST_URL }}
        PRODUCTION_CLIENT_ID: ${{ secrets.PRODUCTION_CLIENT_ID }}

    - name: 🧪 Run QA Test Suite
      run: npm test

    - name: 🎭 Get Playwright version
      id: playwright-version
      run: echo "PLAYWRIGHT_VERSION=$(npm ls @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')" >> $GITHUB_ENV

    - name: 📦 Cache Playwright Binaries
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

    - name: 🌐 Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium

    - name: 🌐 Install Playwright Dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium

    - name: ♿ Run Accessibility & E2E Tests
      run: npm run test:e2e

    - name: 📸 Run Visual Regression Tests
      run: npm run test:visual

    - name: 📁 Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7
