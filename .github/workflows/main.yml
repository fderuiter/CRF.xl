name: CRF.xl CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v3

    - name: ⚙️ Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: 📦 Install Dependencies
      run: npm ci

    - name: 🔐 Audit Production Dependencies
      run: npm audit --omit=dev --audit-level=high

    - name: 🧰 Install XML validation tooling
      run: sudo apt-get update && sudo apt-get install -y libxml2-utils

    - name: 🧾 Validate Office add-in manifests
      run: npm run manifest:validate

    - name: 🔎 Type Checking
      run: npx tsc --noEmit

    - name: 🏗️ Build Application
      run: npm run build --if-present

    - name: 🧪 Run QA Test Suite
      run: npm test

    - name: 📦 Upload manifest artifacts
      if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: office-addin-manifests
        path: |
          manifest.staging.xml
          manifest.production.xml
        retention-days: 30
