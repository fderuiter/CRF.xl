name: CRF.xl CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: 🧰 Install System Dependencies
      run: sudo apt-get update && sudo apt-get install -y libxml2-utils libsecret-1-dev

    - name: 📦 Install Dependencies
      run: npm ci

    - name: 🔐 Audit Production Dependencies
      run: npm audit --omit=dev --audit-level=high

    - name: 🧾 Validate Office add-in manifests
      run: npm run validate

    - name: 📚 Validate Documentation Links
      run: npm run docs:validate

    - name: 🔗 Validate Codebase Traceability
      run: |
        npm run docs:traceability
        git diff --exit-code docs/github/codebase-alignment.md || { echo "Traceability report is out of sync. Please run 'npm run docs:traceability' and commit the changes."; exit 1; }
    - name: 🔎 Type Checking
      run: npx tsc --noEmit
    - name: 💀 Dead Code Check
      run: npm run dead-code

    - name: 🏗️ Build Application
      run: npm run build --if-present
      env:
        DEV_CLIENT_ID: ${{ vars.DEV_CLIENT_ID }}
        STAGING_HOST_URL: ${{ vars.STAGING_HOST_URL }}
        STAGING_CLIENT_ID: ${{ secrets.STAGING_CLIENT_ID }}
        UAT_HOST_URL: ${{ vars.UAT_HOST_URL }}
        UAT_CLIENT_ID: ${{ secrets.UAT_CLIENT_ID }}
        PRODUCTION_HOST_URL: ${{ vars.PRODUCTION_HOST_URL }}
        PRODUCTION_CLIENT_ID: ${{ secrets.PRODUCTION_CLIENT_ID }}

    - name: 🧪 Run QA Test Suite
      run: npm test
