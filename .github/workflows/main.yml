name: CRF.xl CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v3

    - name: ⚙️ Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: 📦 Install Dependencies
      run: npm ci

    - name: 🔎 Type Checking
      run: npx tsc --noEmit

    - name: 🏗️ Build Application
      run: npm run build --if-present

    - name: 🧪 Run QA Test Suite
      run: npm test

    - name: 📋 Validate Manifests
      run: |
        npm run validate:dev
        npm run validate:prod

    - name: 🔒 Production manifest localhost check
      run: |
        if grep -qi "localhost" manifest.prod.xml; then
          echo "ERROR: manifest.prod.xml contains a localhost reference — this is not allowed in production."
          exit 1
        fi
        echo "PASS: no localhost references found in manifest.prod.xml"
