name: Weekly Backlog Review

# Creates a recurring triage issue every Monday at 14:17 UTC.
# Run workflow_dispatch any time to create an ad-hoc review issue.
on:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:

jobs:
  create-backlog-review:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create weekly backlog review issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          WEEK=$(date +"%Y-W%V")
          gh issue create \
            --title "Weekly Backlog Review — ${WEEK}" \
            --label "type:task,area:devops,priority:p1,status:ready,stream:audit-governance" \
            --body "## Weekly Backlog Review — ${WEEK}

          ### Triage checks
          - [ ] Review issues with \`status:needs-more-information\`
          - [ ] Review issues with \`status:needs-design\`
          - [ ] Review issues with no milestone
          - [ ] Review \`priority:p0\` issues not in active milestone
          - [ ] Review stale \`status:in-progress\` issues
          - [ ] Review \`relation:duplicate-candidate\` and \`relation:superseded\` issues

          ### Decision queue
          - [ ] fderuiter/CRF.xl#88 Rule Expression Model
          - [ ] fderuiter/CRF.xl#89 Audit Lifecycle and Governed Field Model
          - [ ] fderuiter/CRF.xl#90 aCRF PDF Rendering Architecture
          - [ ] fderuiter/CRF.xl#91 Migration Import Strategy
          - [ ] fderuiter/CRF.xl#92 VLM & Submission Metadata Scope

          ### Epic health
          - [ ] fderuiter/CRF.xl#35 Fluent UI v9 — verify children closed
          - [ ] fderuiter/CRF.xl#42 Structural Guardrails — verify children closed
          - [ ] fderuiter/CRF.xl#59 Performance — fixture+budget reference reviewed ()
          - [ ] fderuiter/CRF.xl#60 Parse runtime validation — thresholds referenced from mega-study budget ()
          - [ ] fderuiter/CRF.xl#68 Enterprise Distribution — deployment decisions made?

          ### Roadmap
          - [ ] Update fderuiter/CRF.xl#28 if priorities or milestones changed

          ### Notes
          <!-- Add review findings below -->"
