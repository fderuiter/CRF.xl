name: Weekly Backlog Review

# Creates a recurring triage issue every Monday at 14:17 UTC.
# Run workflow_dispatch any time to create an ad-hoc review issue.
on:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:

jobs:
  create-backlog-review:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create weekly backlog review issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          WEEK=$(date +"%Y-W%V")
          gh issue create \
            --title "Weekly Backlog Review — ${WEEK}" \
            --label "type:task,area:devops,priority:p1,status:ready" \
            --body "## Weekly Backlog Review — ${WEEK}

### Triage checks
- [ ] Review issues with \`status:needs-more-information\`
- [ ] Review issues with \`status:needs-design\`
- [ ] Review issues with no milestone
- [ ] Review \`priority:p0\` issues not in active milestone
- [ ] Review stale \`status:in-progress\` issues
- [ ] Review \`relation:duplicate-candidate\` and \`relation:superseded\` issues

### Decision queue
- [ ] #88 Rule Expression Model
- [ ] #89 Audit Lifecycle and Governed Field Model
- [ ] #90 aCRF PDF Rendering Architecture
- [ ] #91 Migration Import Strategy
- [ ] #92 VLM & Submission Metadata Scope

### Epic health
- [ ] #35 Fluent UI v9 — verify children closed
- [ ] #42 Structural Guardrails — verify children closed
- [ ] #59 Performance — fixture defined?
- [ ] #68 Enterprise Distribution — deployment decisions made?

### Roadmap
- [ ] Update #28 if priorities or milestones changed

### Notes
<!-- Add review findings below -->"
