name: E2E Tests on Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  e2e:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        
    - name: Install dependencies
      run: npm install
      
    - name: Build project
      run: npm run build:dev
      
    - name: Run E2E Tests
      run: npx jest test/e2e/e2e.test.ts --runInBand
